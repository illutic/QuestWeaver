name: Code Static Analysis

on:
  pull_request:
    branches: [ "master" ]

jobs:
  get_changed_files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get changed files
        id: changed-files
        run: |
          sh
          #!/bin/bash

          # Function to get changed files, primarily designed for Pull Request contexts in GitHub Actions
          function get_changed_files_in_github_actions() {
            echo "Running in GitHub Actions context."

            # Ensure we have enough git history. This might be needed if checkout was shallow.
            # Consider adding `fetch-depth: 0` to your actions/checkout step in the workflow YAML.
            # Alternatively, try to unshallow if needed (more complex to do conditionally here).
            # git fetch --unshallow --quiet || git fetch --depth=1000 --quiet # Example, adjust as needed

            if [[ -n "$GITHUB_BASE_REF" && -n "$GITHUB_HEAD_REF" ]]; then
              # This context is typically for a pull_request event
              echo "Detected GITHUB_BASE_REF: $GITHUB_BASE_REF"
              echo "Detected GITHUB_HEAD_REF: $GITHUB_HEAD_REF (current branch of the PR)"

              # Make sure local branches are up-to-date with what would be the PR's base and head
              # It's generally better to compare against origin/refs to avoid ambiguity with local branch names,
              # but GITHUB_BASE_REF and GITHUB_HEAD_REF are usually just the short branch names.
              # Fetching ensures we have the objects for these refs from the remote.
              git fetch origin "$GITHUB_BASE_REF":"refs/remotes/origin/$GITHUB_BASE_REF" --quiet
              git fetch origin "$GITHUB_HEAD_REF":"refs/remotes/origin/$GITHUB_HEAD_REF" --quiet # Usually the current branch is already up-to-date

              # Using the three-dot diff, which is often what you want for "changes in the PR"
              # It compares the tip of the head branch with the common ancestor of base and head.
              # Equivalent to `git diff $(git merge-base origin/$GITHUB_BASE_REF origin/$GITHUB_HEAD_REF) origin/$GITHUB_HEAD_REF`
              echo "Comparing origin/$GITHUB_BASE_REF...origin/$GITHUB_HEAD_REF"
              git diff "origin/$GITHUB_BASE_REF"..."origin/$GITHUB_HEAD_REF" --name-only
            elif [[ -n "$GITHUB_REF_NAME" && "$GITHUB_EVENT_NAME" == "push" ]]; then
              # This context is for a push event to a branch (not a PR merge)
              # Here, we usually compare against the previous state of the same branch or its default base.
              # This example compares against where this branch likely diverged from 'main' or 'master'.
              # You might need to adjust 'main' to your repository's default branch.
              DEFAULT_BASE_BRANCH="main" # Or master, develop, etc.
              echo "Detected GITHUB_REF_NAME: $GITHUB_REF_NAME (pushed branch)"
              echo "Assuming base branch for comparison is: $DEFAULT_BASE_BRANCH"

              git fetch origin "$DEFAULT_BASE_BRANCH":"refs/remotes/origin/$DEFAULT_BASE_BRANCH" --quiet
              git fetch origin "$GITHUB_REF_NAME":"refs/remotes/origin/$GITHUB_REF_NAME" --quiet

              echo "Comparing origin/$DEFAULT_BASE_BRANCH...origin/$GITHUB_REF_NAME"
              git diff "origin/$DEFAULT_BASE_BRANCH"..."origin/$GITHUB_REF_NAME" --name-only
            else
              echo "Could not determine appropriate branches for diffing from GitHub Actions environment variables."
              echo "GITHUB_BASE_REF: $GITHUB_BASE_REF"
              echo "GITHUB_HEAD_REF: $GITHUB_HEAD_REF"
              echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
              echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
              echo "Falling back to local method (if applicable and makes sense)."
              # Fallback to local method if it's defined and useful, or exit with error.
              # For CI, usually one of the above conditions should be met.
              # get_changed_files_locally # Uncomment if you have a robust local version
              exit 1 # Or handle fallback differently
            fi
          }

          # Function to get changed files locally (same as your original)
          # This can be kept as a fallback or for local testing of the script.
          function get_changed_files_locally() {
            echo "Running in local context."
            # The way we work allows us to figure out the branch's base since
            # our feature branches always look like this (in respect with the main branch):
            # ... (rest of your original local function)

            number_of_branches_for_head=$(git branch --contains HEAD | wc -l)
            if [ "$number_of_branches_for_head" -gt 1 ]; then
              # Assuming there are no commits yet on the feature branch relative to its tracked remote
              # Or HEAD is already merged / on a shared commit.
              # For a newly created local branch from main, this might be > 1 if main also contains HEAD.
              # Consider what "no commits yet" really means in your workflow.
              # An alternative is to see if HEAD has a remote tracking branch and if it's ahead.
              echo "HEAD is part of multiple branches. This might mean no new commits or already on a shared commit."
              # If you want to list files changed since the remote version of this branch:
              # current_branch=$(git rev-parse --abbrev-ref HEAD)
              # remote_branch=$(git rev-parse --abbrev-ref "$current_branch@{u}" 2>/dev/null)
              # if [ -n "$remote_branch" ]; then
              #   git diff "$remote_branch...HEAD" --name-only
              #   exit 0
              # fi
              exit 0 # Exit successfully, assuming no "new" unpushed changes against a base
            fi

            number_of_branches=0
            back_track=0

            while [ $number_of_branches -le 1 ]; do
              back_track=$((back_track + 1))
              # Protect against going too far back in history on a detached HEAD or shallow clone
              if ! git rev-parse --quiet --verify "HEAD~$back_track" > /dev/null; then
                  echo "Error: Could not find commit HEAD~$back_track. History might be too shallow or branch too short."
                  exit 1
              fi
              number_of_branches=$(git branch --contains "HEAD~$back_track" | wc -l)
            done

            echo "Base commit found: HEAD~$back_track"
            git diff "HEAD~$back_track"...HEAD --name-only
          }

          # Main execution block
          if [[ -n "$GITHUB_ACTIONS" ]]; then # GITHUB_ACTIONS is "true" when running in GitHub Actions
            echo "FILES=$(get_changed_files_in_github_actions)" >> $GITHUB_OUTPUT
          else
            echo "FILES=$(get_changed_files_locally)" >> $GITHUB_OUTPUT
          fi

  kt_lint:
    runs-on: ubuntu-latest
    needs: get_changed_files
    if: ${{ needs.changed_files.outputs.FILES != '' }}
    env:
      KT_LINT_VERSION: ${{ vars.KT_LINT_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Get dependencies
        run: sudo apt-get install -y curl
      - name: Get latest KtLint version
        id: kt-lint-version
        run: |
          version=$(curl -Ls -o /dev/null -w %{url_effective} https://github.com/pinterest/ktlint/releases/latest)
          version=${version##*/}
          
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
      - name: Get latest KtLint
        id: kt-lint-download
        env:
          KT_LINT_VERSION: ${{ steps.kt-lint-version.outputs.VERSION }}
        run: |
          echo "Fetching ktlint: $KT_LINT_VERSION"
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/$KT_LINT_VERSION/ktlint && chmod a+x ktlint
      - name: Get latest Jetpack Compose Lint ruleset version
        id: compose-rules-version
        run: |
          version=$(curl -Ls -o /dev/null -w %{url_effective} https://github.com/mrmans0n/compose-rules/releases/latest)
          version=${version##*/}
          version_numeric=$(echo "$version" | sed 's/[^0-9.]*//g')
          
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION_NUMERIC=$version_numeric" >> "$GITHUB_OUTPUT"
      - name: Get latest Jetpack Compose Lint ruleset
        id: compose-rules-download
        env:
          COMPOSE_RULES_TAG: ${{ steps.compose-rules-version.outputs.VERSION }}
          COMPOSE_RULES_VERSION_NUMERIC: ${{ steps.compose-rules-version.outputs.VERSION_NUMERIC }}
        run: |
          echo "Fetching compose ruleset tag: $COMPOSE_RULES_TAG"
          echo "Using numeric version for jar name: $COMPOSE_RULES_VERSION_NUMERIC"
          compose_ruleset_jar=ktlint-compose-$COMPOSE_RULES_VERSION_NUMERIC-all.jar
          
          curl -sSLO https://github.com/mrmans0n/compose-rules/releases/download/$COMPOSE_RULES_TAG/$compose_ruleset_jar && chmod a+x $compose_ruleset_jar
          echo "COMPOSE_RULESET_JAR=$compose_ruleset_jar" >> "$GITHUB_OUTPUT"
      - name: Run KtLint
        continue-on-error: true
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.FILES }}
          COMPOSE_RULESET_JAR: ${{ steps.compose-rules-download.outputs.COMPOSE_RULESET_JAR }}
        run: |
          echo "Running KtLint with Compose ruleset: $COMPOSE_RULESET_JAR"
          echo "Files to lint: $CHANGED_FILES"
          ./ktlint --reporter=plain-summary --reporter=html,output=build/reports/ktlint/ktlint-report.html --ruleset=$COMPOSE_RULESET_JAR $CHANGED_FILES
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-report
          path: |
            build/reports/ktlint/ktlint-report.html
